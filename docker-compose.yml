version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mock-fitband-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mock_fitband_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security: Only allow connections from specific IPs
    # Configure via AWS Security Group rules instead of here

volumes:
  postgres_data:
    driver: local

networks:
  postgres-network:
    driver: bridge

